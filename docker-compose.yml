name: as4-compara

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-as4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-as4_solo_local}
      POSTGRES_DB: ${POSTGRES_DB:-as4compara}
    volumes:
      - as4_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-as4}:${POSTGRES_PASSWORD:-as4_solo_local}@db:5432/${POSTGRES_DB:-as4compara}
      PORT: "3000"
      TZ: America/Bogota
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  as4_db:
